name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - name: Test
        run: ctest --test-dir build --output-on-failure
  msys2-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
      - name: Verify UCRT64 toolchain
        run: |
          command -v cmake
          command -v ninja
          command -v gcc
          command -v g++
          g++ --version
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - name: Test
        run: |
          export CC="$(cygpath -m "$(command -v gcc)")"
          export CXX="$(cygpath -m "$(command -v g++)")"
          echo "Using C++ compiler: $CXX"
          "$CXX" --version
          ctest --test-dir build --output-on-failure
